<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>realtimeescape.com</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #fff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  .glitch {
    position: relative;
    color: #000;
    font-size: clamp(1.5rem, 5vw, 4rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    user-select: none;
  }

  .glitch::before,
  .glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    opacity: 0;
    pointer-events: none;
  }

  .glitch.glitching::before {
    opacity: 1;
    color: #f0f;
    animation: glitch-shift-1 0.35s steps(2, jump-none) both;
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
  }

  .glitch.glitching::after {
    opacity: 1;
    color: #0ff;
    animation: glitch-shift-2 0.35s steps(2, jump-none) both;
    clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
  }

  .glitch.glitching {
    animation: glitch-skew 0.35s steps(2, jump-none) both;
  }

  @keyframes glitch-shift-1 {
    0%   { transform: translate(-6px, 2px); }
    25%  { transform: translate(4px, -1px); }
    50%  { transform: translate(-3px, 1px); }
    75%  { transform: translate(5px, -2px); }
    100% { transform: translate(0, 0); }
  }

  @keyframes glitch-shift-2 {
    0%   { transform: translate(5px, -2px); }
    25%  { transform: translate(-4px, 2px); }
    50%  { transform: translate(3px, -1px); }
    75%  { transform: translate(-5px, 1px); }
    100% { transform: translate(0, 0); }
  }

  @keyframes glitch-skew {
    0%   { transform: skewX(0deg); }
    20%  { transform: skewX(3deg); }
    40%  { transform: skewX(-2deg); }
    60%  { transform: skewX(1deg); }
    80%  { transform: skewX(-1deg); }
    100% { transform: skewX(0deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .glitch.glitching,
    .glitch.glitching::before,
    .glitch.glitching::after {
      animation: none;
      opacity: 0;
      transform: none;
    }
  }
</style>
</head>
<body>
  <h1 class="glitch" data-text="realtimeescape.com">realtimeescape.com</h1>
  <script>
    const el = document.querySelector('.glitch');

    function scheduleGlitch() {
      const delay = 7000 + Math.random() * 4000; // 7-11s
      setTimeout(() => {
        el.classList.add('glitching');
        setTimeout(() => {
          el.classList.remove('glitching');
          scheduleGlitch();
        }, 350);
      }, delay);
    }

    scheduleGlitch();
  </script>
</body>
</html>
